[tools]
java = "temurin-17"
maven = "3.9"

[env]
SPRING_PROFILES_ACTIVE = "local"
INSURER_BASE_URL = "https://httpstat.us/200?sleep=500"
JWT_SECRET = "local-dev-secret-change-me-32-bytes!!"
AUTH_DEMO_USERNAME = "demo"
AUTH_DEMO_PASSWORD = "demo-password"

[tasks.build]
run = "mvn -q clean verify"
[tasks.test]
run = "mvn -q test"
[tasks.itest]
run = "mvn -q verify"
[tasks.run]
run = "mvn -q -pl service spring-boot:run"
[tasks.format]
run = "mvn -q -pl service -am spotless:apply"
[tasks.setup]
run = "git config core.hooksPath .githooks && mise install"
[tasks.native]
run = "mvn -q -pl service -am install -DskipTests && mvn -Pnative -pl service -DskipTests package spring-boot:build-image"
[tasks.up]
run = '''
#!/usr/bin/env bash
set -euo pipefail
runtime="${1:-jvm}"
overlay="${2:-}"
extra="${3:-}"
cd deployment/compose
if docker compose version >/dev/null 2>&1; then
  compose=(docker compose)
elif command -v docker-compose >/dev/null 2>&1; then
  compose=(docker-compose)
else
  echo "Docker Compose is required" >&2
  exit 1
fi
files=(-f docker-compose.yml -f "docker-compose.${runtime}.yml")
if [ "$overlay" = "observability" ]; then files+=(-f compose.observability.yml); fi
if [ "$overlay" = "full" ]; then files+=(-f compose.fullstack.yml); fi
if [ "$extra" = "e2e" ] || [ "$overlay" = "e2e" ]; then files+=(-f compose.e2e.yml); fi
"${compose[@]}" "${files[@]}" up -d --build
'''
