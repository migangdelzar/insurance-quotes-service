[tools]
java = "temurin-17"
maven = "3.9"

[tasks.build]
run = "SPRING_PROFILES_ACTIVE=local mvn -q clean verify"
[tasks.test]
run = "SPRING_PROFILES_ACTIVE=local mvn -q test"
[tasks.itest]
run = "SPRING_PROFILES_ACTIVE=local mvn -q verify"
[tasks.run]
run = "SPRING_PROFILES_ACTIVE=local mvn -q -pl service spring-boot:run"
[tasks.dev]
description = "Run the API with Spring DevTools and the dev profile"
run = "SPRING_PROFILES_ACTIVE=dev KAFKA_BOOTSTRAP=localhost:9094 INSURER_BASE_URL=http://localhost:8089/submit mvn -q -pl service spring-boot:run"
[tasks.dev-infra]
description = "Start local dependencies for the host-run dev profile"
run = "docker compose -f deployment/compose/docker-compose.yml -f deployment/compose/docker-compose.dev.yml up -d"
[tasks.format]
run = "mvn -q -pl service -am spotless:apply"
[tasks.setup]
run = "git config core.hooksPath .githooks && mise install"
[tasks.native]
run = "mvn -q -pl service -am install -DskipTests && mvn -Pnative -pl service -DskipTests package spring-boot:build-image"
[tasks.up]
run = '''
#!/usr/bin/env bash
set -euo pipefail
runtime="${1:-jvm}"
overlay="${2:-}"
extra="${3:-}"
cd deployment/compose
if docker compose version >/dev/null 2>&1; then
  compose=(docker compose)
elif command -v docker-compose >/dev/null 2>&1; then
  compose=(docker-compose)
else
  echo "Docker Compose is required" >&2
  exit 1
fi
files=(-f docker-compose.yml -f "docker-compose.${runtime}.yml")
if [ "$overlay" = "observability" ]; then files+=(-f compose.observability.yml); fi
if [ "$overlay" = "full" ]; then files+=(-f compose.fullstack.yml); fi
if [ "$extra" = "e2e" ] || [ "$overlay" = "e2e" ]; then files+=(-f compose.e2e.yml); fi
"${compose[@]}" "${files[@]}" up -d --build
'''

[tasks.setup-all]
description = "Install the backend and sibling frontend workspaces"
run = '''
#!/usr/bin/env bash
set -euo pipefail
backend_dir="$(git rev-parse --show-toplevel)"
web_dir="${CLARA_WEB_DIR:-${backend_dir}/../insurance-quotes-web}"

if [ ! -f "$web_dir/package.json" ]; then
  echo "Frontend checkout not found at: $web_dir" >&2
  echo "Set CLARA_WEB_DIR to the frontend repository path." >&2
  exit 1
fi

mise run setup
mise trust -y "$web_dir/mise.toml"
(cd "$web_dir" && mise run setup)
echo "Backend and frontend dependencies are ready."
'''

[tasks.demo]
description = "Install both apps and start the reviewable full-stack demo"
run = '''
#!/usr/bin/env bash
set -euo pipefail

print_access() {
  grafana_password="${GF_SECURITY_ADMIN_PASSWORD:-demo-grafana-password}"
  grafana_access="admin/${grafana_password}"
  printf '\nClara demo is ready\n'
  printf '┌──────────────────┬──────────────────────────────────────────────┬──────────────────────────────────────┐\n'
  printf '│ %-16s │ %-44s │ %-36s │\n' "Resource" "Endpoint" "Credentials / purpose"
  printf '├──────────────────┼──────────────────────────────────────────────┼──────────────────────────────────────┤\n'
  printf '│ %-16s │ %-44s │ %-36s │\n' "Web app" "http://localhost:3100" "Browser entry point"
  printf '│ %-16s │ %-44s │ %-36s │\n' "Vite HMR" "http://localhost:5173" "Optional fast-dev frontend"
  printf '│ %-16s │ %-44s │ %-36s │\n' "API health" "http://localhost:3100/api/actuator/health" "Same-origin BFF check"
  printf '│ %-16s │ %-44s │ %-36s │\n' "Direct API" "http://localhost:8080/actuator/health" "Backend debugging"
  printf '│ %-16s │ %-44s │ %-36s │\n' "API docs" "http://localhost:8080/swagger-ui.html" "OpenAPI / Swagger UI"
  printf '│ %-16s │ %-44s │ %-36s │\n' "API login" "POST /api/auth/login" "JWT issued after password login"
  printf '└──────────────────┴──────────────────────────────────────────────┴──────────────────────────────────────┘\n'

  printf '\nUsers\n'
  printf '┌──────────────────┬────────────────────────┬──────────────────────────────────────┐\n'
  printf '│ %-16s │ %-22s │ %-36s │\n' "Username" "Password" "Journey"
  printf '├──────────────────┼────────────────────────┼──────────────────────────────────────┤\n'
  printf '│ %-16s │ %-22s │ %-36s │\n' "demo" "demo-password" "Standard happy path"
  printf '│ %-16s │ %-22s │ %-36s │\n' "demo-two" "demo-password-two" "Independent passkey journey"
  printf '│ %-16s │ %-22s │ %-36s │\n' "demo-three" "demo-password-three" "Independent manual session"
  printf '│ %-16s │ %-22s │ %-36s │\n' "demo-admin" "demo-admin-password" "Read-only oversight"
  printf '└──────────────────┴────────────────────────┴──────────────────────────────────────┘\n'

  printf '\nInfrastructure and observability\n'
  printf '┌──────────────────┬────────────────────────────────┬──────────────────────────────────────────────┐\n'
  printf '│ %-16s │ %-30s │ %-44s │\n' "Service" "Endpoint" "Credentials / purpose"
  printf '├──────────────────┼────────────────────────────────┼──────────────────────────────────────────────┤\n'
  printf '│ %-16s │ %-30s │ %-44s │\n' "PostgreSQL" "localhost:5432" "postgres/postgres; quotes_app/quotes_app"
  printf '│ %-16s │ %-30s │ %-44s │\n' "Redis" "localhost:6379" "No authentication"
  printf '│ %-16s │ %-30s │ %-44s │\n' "Kafka" "localhost:9094" "No authentication"
  printf '│ %-16s │ %-30s │ %-44s │\n' "WireMock" "http://localhost:8089/__admin" "No authentication"
  printf '│ %-16s │ %-30s │ %-44s │\n' "Grafana" "http://localhost:3001" "$grafana_access"
  printf '│ %-16s │ %-30s │ %-44s │\n' "Prometheus" "http://localhost:9090" "No authentication"
  printf '│ %-16s │ %-30s │ %-44s │\n' "Loki" "http://localhost:3101" "No authentication"
  printf '│ %-16s │ %-30s │ %-44s │\n' "Tempo" "http://localhost:3200" "No authentication"
  printf '│ %-16s │ %-30s │ %-44s │\n' "OTLP traces" "localhost:4317 / 4318" "Trace ingestion only"
  printf '└──────────────────┴────────────────────────────────┴──────────────────────────────────────────────┘\n'

  printf '\nFirst passkey use: sign in with a password, then enroll a passkey before\ntrying passwordless login.\n'
  printf 'Observability: mise run up jvm observability\n'
  printf 'Stop:          mise run stop\n'
  printf 'Reset data:    mise run reset-demo\n'
}

if curl --fail --silent --max-time 3 http://localhost:3100/api/actuator/health |
  grep -q '"status":"UP"'; then
  echo "A healthy Clara stack is already running; reusing it."
  print_access
  exit 0
fi

mise run setup-all
mise run up jvm full e2e
print_access
'''

[tasks.stop]
description = "Stop and remove the local full-stack demo containers and volumes"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd deployment/compose
docker compose \
  -f docker-compose.yml \
  -f docker-compose.jvm.yml \
  -f docker-compose.native.yml \
  -f compose.observability.yml \
  -f compose.fullstack.yml \
  -f compose.e2e.yml \
  down --volumes --remove-orphans
'''

[tasks.reset-demo]
description = "Reset local PostgreSQL, Redis, and Kafka demo state, then restart the stack"
run = "./scripts/reset-demo.sh"

[tasks.logs]
description = "Follow API JSON logs from the full-stack demo"
run = "./scripts/demo-observability.sh follow"

[tasks.logs-all]
description = "Follow logs from every local demo container"
run = "./scripts/demo-observability.sh all"

[tasks.logs-errors]
description = "Print recent warnings and errors from the API"
run = "./scripts/demo-observability.sh errors"

[tasks.diagnose]
description = "Check health, boundaries, tracing, and known infrastructure errors"
run = "./scripts/demo-observability.sh check"
