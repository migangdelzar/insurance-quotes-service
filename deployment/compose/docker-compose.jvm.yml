services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: quotes_app
      DB_PASSWORD: quotes_app
      JWT_SECRET: docker-dev-secret-change-me-32-byte!
      INSURER_BASE_URL: https://httpstat.us/200?sleep=500
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3100,http://127.0.0.1:3000,http://127.0.0.1:3100
      AUTH_WEBAUTHN_ORIGINS: http://localhost:3000,http://localhost:3100,http://127.0.0.1:3000,http://127.0.0.1:3100
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
