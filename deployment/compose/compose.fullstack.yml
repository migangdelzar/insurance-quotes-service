services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro

  web:
    build:
      context: ../../../insurance-quotes-web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3100:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    environment:
      INSURER_BASE_URL: http://wiremock:8080/submit
    depends_on:
      wiremock:
        condition: service_started
