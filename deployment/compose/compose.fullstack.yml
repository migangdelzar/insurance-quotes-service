services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health | grep -q healthy"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ../../../insurance-quotes-web
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "3100:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    environment:
      INSURER_BASE_URL: http://wiremock:8080/submit
    depends_on:
      wiremock:
        condition: service_healthy
