services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8089:8080"

  api:
    environment:
      INSURER_BASE_URL: http://wiremock:8080/submit
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3100,http://127.0.0.1:3000,http://127.0.0.1:3100
      WEB_RATE_LIMIT_ENABLED: ${WEB_RATE_LIMIT_ENABLED:-true}
      WEB_RATE_LIMIT_AUTH_LIMIT: ${WEB_RATE_LIMIT_AUTH_LIMIT:-10}
      WEB_RATE_LIMIT_QUOTE_MUTATION_LIMIT: ${WEB_RATE_LIMIT_QUOTE_MUTATION_LIMIT:-30}
    depends_on:
      wiremock:
        condition: service_started
