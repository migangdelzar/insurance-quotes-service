spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:10s}
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:3s}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:1s}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:5m}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:10m}
      keepalive-time: ${DB_POOL_KEEPALIVE:0}

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:32}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
      max-queue-capacity: ${SERVER_TOMCAT_THREADS_MAX_QUEUE:25}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:64}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:25}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:10s}
    max-keep-alive-requests: ${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}
