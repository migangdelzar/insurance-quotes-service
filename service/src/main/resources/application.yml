spring:
  application:
    name: insurance-quotes-service
  http:
    converters:
      preferred-json-mapper: jackson2
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quotes}
    username: ${DB_USER:quotes_app}
    password: ${DB_PASSWORD:quotes_app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    cache-names: quotes
    redis:
      time-to-live: 10m
      cache-null-values: false
      enable-statistics: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

insurer:
  base-url: ${INSURER_BASE_URL:https://httpstat.us/200?sleep=500}
  connect-timeout: 2s
  read-timeout: 5s

auth:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-32-bytes!!}
    ttl: 30m
  demo:
    username: ${AUTH_DEMO_USERNAME:demo}
    password: ${AUTH_DEMO_PASSWORD:demo-password}
    users:
      - username: ${AUTH_DEMO_USERNAME:demo}
        password: ${AUTH_DEMO_PASSWORD:demo-password}
      - username: ${AUTH_DEMO_USERNAME_2:demo-two}
        password: ${AUTH_DEMO_PASSWORD_2:demo-password-two}
      - username: ${AUTH_DEMO_USERNAME_3:demo-three}
        password: ${AUTH_DEMO_PASSWORD_3:demo-password-three}
      - username: ${AUTH_DEMO_USERNAME_ADMIN:demo-admin}
        password: ${AUTH_DEMO_PASSWORD_ADMIN:demo-admin-password}
        role: ADMIN

  webauthn:
    origins: ${AUTH_WEBAUTHN_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3100}

web:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:3100}
  rate-limit:
    enabled: ${WEB_RATE_LIMIT_ENABLED:true}
    trust-forwarded-headers: ${WEB_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
    auth:
      limit: ${WEB_RATE_LIMIT_AUTH_LIMIT:10}
      window: ${WEB_RATE_LIMIT_AUTH_WINDOW:1m}
    quote-mutation:
      limit: ${WEB_RATE_LIMIT_QUOTE_MUTATION_LIMIT:30}
      window: ${WEB_RATE_LIMIT_QUOTE_MUTATION_WINDOW:1m}

quote:
  expiration:
    draft-ttl: ${QUOTE_DRAFT_TTL:30m}
    check-interval: ${QUOTE_EXPIRATION_CHECK_INTERVAL:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
