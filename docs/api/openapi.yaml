openapi: 3.1.0
info:
  title: Insurance Quotes API
  description: "Multi-step insurance quote flow: create, coverage, submit."
  version: 1.0.0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
paths:
  /quotes:
    get:
      tags:
      - quote-controller
      operationId: listQuotes
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteView"
    post:
      tags:
      - quote-controller
      operationId: create
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuoteView"
  /quotes/{id}/submit:
    post:
      tags:
      - submission-controller
      operationId: submit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuoteView"
  /auth/webauthn/register:
    post:
      tags:
      - auth-controller
      operationId: register
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnRegisterRequest"
        required: true
      responses:
        "204":
          description: No Content
  /auth/webauthn/register-options:
    post:
      tags:
      - auth-controller
      operationId: registerOptions
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebAuthnChallengeResponse"
  /auth/webauthn/assertion-options:
    post:
      tags:
      - auth-controller
      operationId: assertionOptions
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssertionOptionsRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WebAuthnChallengeResponse"
  /auth/webauthn/assert:
    post:
      tags:
      - auth-controller
      operationId: assertPasskey
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnAssertRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
  /auth/refresh:
    post:
      tags:
      - auth-controller
      operationId: refresh
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenPairResponse"
  /auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          description: No Content
  /auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      parameters:
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /quotes/{id}/coverage:
    patch:
      tags:
      - quote-controller
      operationId: updateCoverage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCoverageRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuoteView"
  /quotes/{id}:
    get:
      tags:
      - quote-controller
      operationId: getQuote
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: API-Version
        in: header
        schema:
          type: string
          default: 1.0.0
          enum:
          - "1.0"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QuoteView"
components:
  schemas:
    CreateQuoteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        age:
          type: integer
          format: int32
          maximum: 120
          minimum: 18
        zipCode:
          type: string
          minLength: 1
          pattern: "\\d{5}"
      required:
      - age
      - email
      - name
      - zipCode
    QuoteView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        age:
          type: integer
          format: int32
        zipCode:
          type: string
        coverageType:
          type: string
          enum:
          - BASIC
          - STANDARD
          - PREMIUM
        hasPreexistingConditions:
          type: boolean
        conditions:
          type: array
          items:
            type: string
            enum:
            - DIABETES
            - HEART_DISEASE
            - HYPERTENSION
            - CANCER_HISTORY
            - OTHER
          uniqueItems: true
        takesPrescriptionMedication:
          type: boolean
        usesTobacco:
          type: boolean
        needsSpouseCoverage:
          type: boolean
        monthlyPremium:
          type: number
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - SUBMISSION_FAILED
          - EXPIRED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WebAuthnRegisterRequest:
      type: object
      properties:
        challengeId:
          type: string
          minLength: 1
        credentialJson:
          type: string
          minLength: 1
      required:
      - challengeId
      - credentialJson
    WebAuthnChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
        publicKeyOptionsJson:
          type: string
    AssertionOptionsRequest:
      type: object
      properties:
        username:
          type: string
    WebAuthnAssertRequest:
      type: object
      properties:
        challengeId:
          type: string
          minLength: 1
        credentialJson:
          type: string
          minLength: 1
        mfaToken:
          type: string
      required:
      - challengeId
      - credentialJson
    TokenPairResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        status:
          type: string
        mfaToken:
          type: string
        tokens:
          $ref: "#/components/schemas/TokenPairResponse"
    UpdateCoverageRequest:
      type: object
      properties:
        coverageType:
          type: string
          enum:
          - BASIC
          - STANDARD
          - PREMIUM
        hasPreexistingConditions:
          type: boolean
        conditions:
          type: array
          items:
            type: string
            enum:
            - DIABETES
            - HEART_DISEASE
            - HYPERTENSION
            - CANCER_HISTORY
            - OTHER
          uniqueItems: true
        takesPrescriptionMedication:
          type: boolean
        usesTobacco:
          type: boolean
        needsSpouseCoverage:
          type: boolean
      required:
      - coverageType
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
