---
name: Backend CI

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: >-
    backend-ci-${{ github.event.pull_request.head.repo.full_name ||
    github.repository }}-${{ github.event.pull_request.head.ref ||
    github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Java 17 verification
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify service
        run: mvn -B -pl service -am verify

  api-e2e:
    name: REST API end-to-end journeys
    needs: verify
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run REST API E2E suite
        run: mvn -B -pl service -am -Pe2e verify

  docker:
    name: Build JVM API image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: false
          tags: insurance-quotes-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Validate Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate JVM Compose configuration
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.api.yml
          -f deployment/compose/docker-compose.jvm.yml
          config

  observability-compose:
    name: Validate observability Compose configuration
    runs-on: ubuntu-latest
    env:
      GF_SECURITY_ADMIN_PASSWORD: ci-only-grafana-password
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate Prometheus, Grafana, Loki, Tempo and Alloy configuration
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.api.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/compose.observability.yml
          config
