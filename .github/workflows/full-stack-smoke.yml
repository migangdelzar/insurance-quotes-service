---
name: Full-stack JVM Smoke

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend branch, tag, or SHA to verify with this backend
        required: false
        default: feat-frontend

concurrency:
  group: >-
    full-stack-smoke-${{ github.event.pull_request.head.repo.full_name ||
    github.repository }}-${{ github.event.pull_request.head.ref ||
    github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Compose API and web smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: insurance-quotes-service

      - name: Check out frontend baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: migangdelzar/insurance-quotes-web
          # Keep the cross-repository smoke test on a frontend ref that
          # contains the production Dockerfile. Once the frontend PR is
          # merged, this can be switched to main or supplied manually.
          ref: ${{ inputs.frontend_ref || 'feat-frontend' }}
          path: insurance-quotes-web

      - name: Validate full-stack Compose configuration
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/docker-compose.ci.yml
          -f deployment/compose/compose.fullstack.yml
          config

      - name: Remove any stale Compose state
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/docker-compose.ci.yml
          -f deployment/compose/compose.fullstack.yml
          down --volumes --remove-orphans

      - name: Start full JVM stack
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/docker-compose.ci.yml
          -f deployment/compose/compose.fullstack.yml
          up -d --build

      - name: Wait for API and web
        working-directory: insurance-quotes-service
        run: |
          set -euo pipefail
          health_url=http://localhost:8080/actuator/health
          compose=(
            docker compose
            -f deployment/compose/docker-compose.yml
            -f deployment/compose/docker-compose.jvm.yml
            -f deployment/compose/docker-compose.ci.yml
            -f deployment/compose/compose.fullstack.yml
          )
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$health_url" |
              grep -q '"status":"UP"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              "${compose[@]}" logs api
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:3100/ > /dev/null
          curl --fail --silent http://localhost:3100/api/actuator/health |
            grep -q '"status":"UP"'

      - name: Verify seeded password logins through the API
        run: |
          set -euo pipefail
          login_url=http://localhost:3100/api/auth/login
          login() {
            local username="$1"
            local password="$2"
            curl --fail --silent --show-error "$login_url" \
              -H 'Content-Type: application/json' \
              -H 'API-Version: 1.0' \
              --data "{\"username\":\"$username\",\"password\":\"$password\"}"
          }
          login demo demo-password | grep -q '"status":"TOKENS_ISSUED"'
          login demo-two demo-password-two | grep -q '"status":"TOKENS_ISSUED"'
          login demo-three demo-password-three |
            grep -q '"status":"TOKENS_ISSUED"'

      - name: Verify login survives API container recreation
        working-directory: insurance-quotes-service
        run: |
          set -euo pipefail
          docker compose \
            -f deployment/compose/docker-compose.yml \
            -f deployment/compose/docker-compose.jvm.yml \
            -f deployment/compose/docker-compose.ci.yml \
            -f deployment/compose/compose.fullstack.yml \
            up -d --force-recreate api
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/actuator/health |
              grep -q '"status":"UP"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f deployment/compose/docker-compose.yml -f deployment/compose/docker-compose.jvm.yml -f deployment/compose/docker-compose.ci.yml -f deployment/compose/compose.fullstack.yml logs api
              exit 1
            fi
            sleep 2
          done
          login_url=http://localhost:3100/api/auth/login
          credentials='{"username":"demo-three","password":"demo-password-three"}'
          curl --fail --silent --show-error "$login_url" \
            -H 'Content-Type: application/json' \
            -H 'API-Version: 1.0' \
            --data "$credentials" |
            grep -q '"status":"TOKENS_ISSUED"'

      - name: Tear down full stack
        if: ${{ always() }}
        working-directory: insurance-quotes-service
        run: >-
          docker compose
          -f deployment/compose/docker-compose.yml
          -f deployment/compose/docker-compose.jvm.yml
          -f deployment/compose/docker-compose.ci.yml
          -f deployment/compose/compose.fullstack.yml
          down --volumes --remove-orphans
